name: check

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      MOON_WORK: "off"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.toolchain }}

      - name: moon version
        run: |
          moon version --all

      - name: moon check
        run: |
          moon update
          moon check --target all --deny-warn

      - name: moon info
        run: |
          moon info --target all
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all --deny-warn
          moon test --target all --release --deny-warn
